<!-- SOLFAI FRONTEND POLISH HOTFIX — paste before </body> -->
<style id="solfai-polish-hotfix">
  :root {
    --polish-ease: cubic-bezier(.22, .61, .36, 1);
    --polish-teal: #00b8ad;
    --polish-teal-dark: #0d9488;
    --polish-purple: #8b5cf6;
  }

  /* Cleaner logo */
  .sidebar-logo-icon {
    background: linear-gradient(145deg, #061923, #101629) !important;
    border: 1px solid rgba(255,255,255,.1) !important;
    box-shadow: none !important;
    position: relative;
    overflow: hidden;
  }

  .sidebar-logo-icon::before {
    content: "𝄞";
    font-family: Georgia, serif;
    font-size: 1.35rem;
    line-height: 1;
    background: linear-gradient(180deg, #00b8ad 0%, #8b5cf6 52%, #f2c166 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .sidebar-logo-icon > * {
    display: none !important;
  }

  .sidebar-logo-text {
    font-family: "Cormorant Garamond", serif !important;
    letter-spacing: .08em !important;
    text-transform: uppercase !important;
    background: none !important;
    -webkit-text-fill-color: var(--text) !important;
    color: var(--text) !important;
  }

  [data-theme="light"] .sidebar-logo-icon {
    background: #fff !important;
    border-color: rgba(17,24,39,.12) !important;
  }

  /* Upload/PDF preview cleanup */
  .upload-zone {
    min-height: 360px !important;
    max-height: 440px !important;
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    transition: border-color .22s var(--polish-ease), background .22s var(--polish-ease), transform .22s var(--polish-ease) !important;
  }

  .upload-zone.dragover,
  .upload-zone:hover {
    border-color: var(--teal) !important;
    background: rgba(13,148,136,.06) !important;
  }

  .annotation-wrapper {
    width: 100% !important;
    max-width: 360px !important;
    max-height: 320px !important;
    margin: 16px auto 0 !important;
    overflow: hidden !important;
    border-radius: 14px !important;
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    display: none;
    align-items: center !important;
    justify-content: center !important;
  }

  .annotation-wrapper:has(.preview-img[src]:not([src=""])) {
    display: flex !important;
  }

  .preview-img {
    width: 100% !important;
    height: 100% !important;
    max-height: 320px !important;
    object-fit: contain !important;
    transform: none !important;
    cursor: default !important;
    border-radius: 12px !important;
  }

  .annotation-canvas {
    pointer-events: none;
  }

  /* Piano keyboard: no ugly desktop scrolling */
  .piano-container,
  .piano-scroll,
  #pianoKeys {
    overflow-x: hidden !important;
    overflow-y: hidden !important;
    scrollbar-width: none !important;
  }

  .piano-container::-webkit-scrollbar,
  .piano-scroll::-webkit-scrollbar,
  #pianoKeys::-webkit-scrollbar {
    display: none !important;
  }

  #pianoKeys {
    width: 100% !important;
    max-width: 100% !important;
    display: flex !important;
    justify-content: center !important;
    cursor: default !important;
    user-select: none !important;
    touch-action: manipulation !important;
  }

  #pianoKeys .piano-key {
    transition: transform .16s var(--polish-ease), background .16s var(--polish-ease), box-shadow .16s var(--polish-ease) !important;
  }

  #pianoKeys .piano-key:hover {
    transform: translateY(1px);
  }

  #pianoKeys .piano-key.active {
    background: linear-gradient(180deg, var(--teal-light), var(--teal)) !important;
    box-shadow: inset 0 -10px 18px rgba(0,0,0,.18), 0 0 0 1px rgba(0,184,173,.4) !important;
  }

  @media (max-width: 720px) {
    #pianoKeys {
      justify-content: flex-start !important;
      overflow-x: auto !important;
    }
  }

  /* Loading state: calmer and less glitchy */
  .analysis-state-card,
  #loading {
    min-height: 520px !important;
    animation: solfaiFadeIn .32s var(--polish-ease) both !important;
  }

  .spinner {
    width: 42px !important;
    height: 42px !important;
    border-width: 2px !important;
    animation: solfaiSpin 1.45s linear infinite !important;
  }

  .loading-step {
    transition: opacity .28s var(--polish-ease), color .28s var(--polish-ease), transform .28s var(--polish-ease) !important;
  }

  .loading-step.active {
    transform: translateY(-2px);
  }

  .skeleton {
    opacity: .72 !important;
    background: linear-gradient(90deg, var(--card2) 0%, rgba(255,255,255,.055) 42%, var(--card2) 84%) !important;
    background-size: 220% 100% !important;
    animation: solfaiSkeleton 2.4s ease-in-out infinite !important;
  }

  [data-theme="light"] .skeleton {
    background: linear-gradient(90deg, #eceff3 0%, #f8fafc 42%, #eceff3 84%) !important;
    background-size: 220% 100% !important;
  }

  /* Ask Solfai chat: less generic, more product-like */
  .chat-container {
    border-radius: 18px !important;
    border: 1px solid var(--border) !important;
    overflow: hidden !important;
    background:
      linear-gradient(180deg, rgba(13,148,136,.035), transparent 34%),
      var(--card) !important;
    box-shadow: var(--shadow-card) !important;
  }

  .chat-top-bar {
    padding: 18px 22px !important;
    border-bottom: 1px solid var(--border) !important;
    background: rgba(255,255,255,.015) !important;
  }

  .chat-top-title {
    font-family: "Cormorant Garamond", serif !important;
    font-size: 1.35rem !important;
    font-weight: 700 !important;
    letter-spacing: -.01em !important;
  }

  .chat-part-badge {
    font-family: Inter, sans-serif !important;
    font-size: .68rem !important;
    color: var(--violet-light) !important;
    background: var(--violet-dim) !important;
    border: 1px solid rgba(139,127,212,.25) !important;
    padding: 4px 10px !important;
    border-radius: 999px !important;
  }

  .chat-messages {
    min-height: 280px !important;
    padding: 20px 22px !important;
  }

  .chat-empty {
    gap: 12px !important;
    color: var(--text2) !important;
  }

  .chat-empty > div:first-child {
    width: 42px !important;
    height: 42px !important;
    border-radius: 14px !important;
    display: grid !important;
    place-items: center !important;
    font-size: 0 !important;
    opacity: 1 !important;
    background: var(--teal-dim) !important;
    border: 1px solid rgba(13,148,136,.18) !important;
  }

  .chat-empty > div:first-child::before {
    content: "Ask";
    font-family: Inter, sans-serif;
    font-size: .72rem;
    font-weight: 700;
    color: var(--teal-light);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .chat-empty > div:nth-child(2) {
    max-width: 340px !important;
    font-size: .92rem !important;
    line-height: 1.6 !important;
  }

  .chat-pills {
    padding: 14px 22px !important;
    border-top: 1px solid var(--border) !important;
    gap: 8px !important;
  }

  .chat-pills .pill {
    border-radius: 999px !important;
    padding: 8px 12px !important;
    border: 1px solid var(--border) !important;
    background: rgba(255,255,255,.02) !important;
    color: var(--text2) !important;
    transition: background .16s var(--polish-ease), color .16s var(--polish-ease), border-color .16s var(--polish-ease), transform .16s var(--polish-ease) !important;
  }

  .chat-pills .pill:hover {
    color: var(--teal-light) !important;
    border-color: rgba(13,148,136,.35) !important;
    background: var(--teal-dim) !important;
    transform: translateY(-1px);
  }

  .chat-input-area {
    padding: 16px 22px 20px !important;
    border-top: 1px solid var(--border) !important;
    gap: 12px !important;
    align-items: flex-end !important;
  }

  .chat-input {
    min-height: 54px !important;
    border-radius: 14px !important;
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    padding: 15px 16px !important;
    color: var(--text) !important;
    resize: vertical !important;
    transition: border-color .18s var(--polish-ease), box-shadow .18s var(--polish-ease) !important;
  }

  .chat-input:focus {
    outline: none !important;
    border-color: rgba(13,148,136,.55) !important;
    box-shadow: 0 0 0 4px rgba(13,148,136,.12) !important;
  }

  .btn-ask {
    min-height: 54px !important;
    min-width: 86px !important;
    border-radius: 14px !important;
    background: linear-gradient(180deg, var(--teal-light), var(--teal)) !important;
    color: #061014 !important;
    font-weight: 700 !important;
    transition: transform .16s var(--polish-ease), filter .16s var(--polish-ease), opacity .16s var(--polish-ease) !important;
  }

  .btn-ask:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.05);
  }

  .btn-ask:disabled {
    opacity: .45 !important;
    cursor: not-allowed !important;
  }

  .chat-message,
  .message,
  .user-message,
  .ai-message {
    line-height: 1.65 !important;
  }

  /* Auth visual states */
  body.solfai-signed-out .results,
  body.solfai-signed-out #chatSection {
    filter: saturate(.85);
  }

  body.solfai-analyzing #analyzeBtn {
    opacity: .72 !important;
    cursor: wait !important;
  }

  /* Cleaner global feel */
  .analyze-card,
  .content-box,
  .info-card,
  .practice-card,
  .chat-container {
    transition: transform .18s var(--polish-ease), border-color .18s var(--polish-ease), box-shadow .18s var(--polish-ease), background .22s var(--polish-ease) !important;
  }

  .analyze-card:hover,
  .content-box:hover,
  .info-card:hover {
    border-color: var(--border-light) !important;
  }

  @keyframes solfaiSpin {
    to { transform: rotate(360deg); }
  }

  @keyframes solfaiSkeleton {
    0% { background-position: 140% 0; }
    100% { background-position: -140% 0; }
  }

  @keyframes solfaiFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<script id="solfai-polish-hotfix-js">
(() => {
  const $id = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  let activeAnalysisController = null;
  let activeAnalysisToken = 0;
  let analysisStageTimer = null;

  function toast(message, type = "info") {
    if (typeof window.showToast === "function") {
      window.showToast(message, type);
      return;
    }
    console[type === "error" ? "error" : "log"](message);
  }

  function setSignedClass() {
    document.body.classList.toggle("solfai-signed-out", !window.currentUser);
    document.body.classList.toggle("solfai-signed-in", !!window.currentUser);
  }

  function resetChatState() {
    const messages = $id("chatMessages");
    const empty = $id("chatEmpty");
    const input = $id("chatInput");
    const send = $id("sendBtn");

    if (messages && empty) {
      messages.innerHTML = "";
      messages.appendChild(empty);
      empty.style.display = "";
      const copy = empty.querySelector("div:nth-child(2)");
      if (copy) {
        copy.textContent = "Ask about breathing, rhythm, solfege, pronunciation, or difficult intervals.";
      }
    }

    if (input) input.value = "";
    if (send) send.disabled = true;
  }

  function resetAnalysisState(reason = "") {
    document.body.classList.remove("solfai-analyzing");

    const loading = $id("loading");
    const results = $id("results");
    const placeholder = $id("resultsPlaceholder");
    const analyzeBtn = $id("analyzeBtn");
    const error = $id("errorMsg");

    if (loading) loading.style.display = "none";
    if (results) results.style.display = "none";
    if (placeholder) placeholder.style.display = "";
    if (analyzeBtn) {
      analyzeBtn.disabled = !$id("fileInput")?.files?.length;
      analyzeBtn.textContent = "Analyze Sheet Music";
    }
    if (error && reason) {
      error.textContent = reason;
      error.style.display = "block";
    }

    ["upload","preprocess","analyze","validate","done"].forEach((name, index) => {
      const step = $id(`step-${name}`);
      if (!step) return;
      step.classList.toggle("active", index === 0);
      step.classList.remove("complete");
    });

    const sub = $id("loadingSub");
    if (sub) sub.textContent = "Ready.";
  }

  function cancelActiveAnalysis(reason = "Analysis stopped.") {
    activeAnalysisToken += 1;

    if (activeAnalysisController) {
      try { activeAnalysisController.abort(); } catch {}
      activeAnalysisController = null;
    }

    if (analysisStageTimer) {
      clearTimeout(analysisStageTimer);
      analysisStageTimer = null;
    }

    resetAnalysisState(reason);
  }

  function renderSignedOutState() {
    setSignedClass();
    cancelActiveAnalysis("Analysis stopped because you signed out.");
    resetChatState();

    const preview = $id("previewImg");
    const fileInput = $id("fileInput");
    const wrapper = $id("annotationWrapper");

    if (fileInput) fileInput.value = "";
    if (preview) preview.removeAttribute("src");
    if (wrapper) wrapper.style.display = "none";

    toast("Signed out", "info");
  }

  function renderSignedInState() {
    setSignedClass();
    toast("Signed in", "success");
  }

  function installAuthPatch() {
    const originalUpdateUserUI = window.updateUserUI;
    if (typeof originalUpdateUserUI === "function") {
      window.updateUserUI = function patchedUpdateUserUI(...args) {
        const result = originalUpdateUserUI.apply(this, args);
        setSignedClass();
        return result;
      };
    }

    const originalHandleGoogleCredential = window.handleGoogleCredential;
    if (typeof originalHandleGoogleCredential === "function") {
      window.handleGoogleCredential = function patchedGoogleCredential(...args) {
        const result = originalHandleGoogleCredential.apply(this, args);
        renderSignedInState();
        return result;
      };
    }

    window.solfaiSignOut = function patchedSolfaiSignOut() {
      window.currentUser = null;
      localStorage.removeItem("solfai-user");

      if (typeof google !== "undefined" && google.accounts?.id) {
        google.accounts.id.disableAutoSelect();
      }

      if (typeof originalUpdateUserUI === "function") {
        originalUpdateUserUI();
      }

      renderSignedOutState();
    };

    setSignedClass();
  }

  function installChatPatch() {
    const input = $id("chatInput");
    const send = $id("sendBtn");

    if (input && send) {
      const sync = () => {
        send.disabled = !input.value.trim() || send.dataset.loading === "true";
      };

      input.addEventListener("input", sync);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (!send.disabled) send.click();
        }
      });

      const originalClick = send.onclick;
      send.addEventListener("click", async () => {
        if (!input.value.trim()) return;
        send.dataset.loading = "true";
        send.disabled = true;
        const old = send.textContent;
        send.textContent = "Thinking";
        setTimeout(() => {
          send.dataset.loading = "false";
          send.textContent = old || "Send";
          sync();
        }, 1400);
      }, true);

      sync();
    }

    const chips = document.querySelectorAll(".chat-pills .pill");
    const replacements = [
      ["How do I find my entrance?", "How do I find my entrance in this piece?"],
      ["Explain the rhythm", "Explain the rhythm in the hardest measures."],
      ["Mark hard intervals", "Which intervals should I practice slowly?"],
      ["Help with solfege", "Give me solfege help for my part."],
      ["Breathing plan", "Where should I breathe and stagger breathe?"],
      ["Pronunciation tips", "Give me pronunciation tips for the lyrics."]
    ];

    chips.forEach((chip, i) => {
      if (!replacements[i]) return;
      chip.textContent = replacements[i][0];
      chip.onclick = () => {
        if (typeof window.fillQ === "function") window.fillQ(replacements[i][1]);
      };
    });
  }

  function installPianoPatch() {
    const keys = $id("pianoKeys");
    if (!keys) return;

    keys.addEventListener("wheel", (e) => {
      if (window.innerWidth > 720) e.preventDefault();
    }, { passive: false });

    keys.addEventListener("touchmove", (e) => {
      if (window.innerWidth > 720) e.preventDefault();
    }, { passive: false });

    keys.scrollLeft = 0;
  }

  function installPreviewPatch() {
    const img = $id("previewImg");
    const wrapper = $id("annotationWrapper");
    const input = $id("fileInput");

    if (img) {
      img.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
      img.addEventListener("dblclick", (e) => e.preventDefault());
      img.style.transform = "none";
    }

    if (input && wrapper) {
      input.addEventListener("change", () => {
        wrapper.style.display = input.files?.length ? "flex" : "none";
      });
    }
  }

  async function runCalmLoadingSequence(token) {
    const stages = [
      ["upload", "Uploading score…", 450],
      ["preprocess", "Preparing notation for reading…", 650],
      ["analyze", "Reading notes, rhythm, and text…", 850],
      ["validate", "Checking key, pitch, and solfege…", 700]
    ];

    document.body.classList.add("solfai-analyzing");

    for (const [name, label, ms] of stages) {
      if (token !== activeAnalysisToken) return;

      ["upload","preprocess","analyze","validate","done"].forEach(s => {
        const el = $id(`step-${s}`);
        if (!el) return;
        el.classList.toggle("active", s === name);
        if (stages.findIndex(x => x[0] === s) < stages.findIndex(x => x[0] === name)) {
          el.classList.add("complete");
        }
      });

      const sub = $id("loadingSub");
      if (sub) sub.textContent = label;
      await sleep(ms);
    }
  }

  function installAnalyzePatch() {
    const btn = $id("analyzeBtn");
    if (!btn) return;

    btn.addEventListener("click", () => {
      activeAnalysisToken += 1;
      activeAnalysisController = new AbortController();
      runCalmLoadingSequence(activeAnalysisToken);
    }, true);

    const observer = new MutationObserver(() => {
      const loading = $id("loading");
      const results = $id("results");
      if (results && getComputedStyle(results).display !== "none") {
        document.body.classList.remove("solfai-analyzing");
        const done = $id("step-done");
        if (done) done.classList.add("active", "complete");
      }
      if (loading && getComputedStyle(loading).display === "none") {
        document.body.classList.remove("solfai-analyzing");
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["style", "class"]
    });
  }

  function installUploadResetPatch() {
    const input = $id("fileInput");
    const btn = $id("analyzeBtn");
    if (!input || !btn) return;

    input.addEventListener("change", () => {
      const hasFile = !!input.files?.length;
      btn.disabled = !hasFile;
      if (hasFile) {
        const error = $id("errorMsg");
        if (error) {
          error.textContent = "";
          error.style.display = "none";
        }
      }
    });
  }

  function install() {
    installAuthPatch();
    installChatPatch();
    installPianoPatch();
    installPreviewPatch();
    installAnalyzePatch();
    installUploadResetPatch();

    const empty = $id("chatEmpty");
    if (empty) {
      const copy = empty.querySelector("div:nth-child(2)");
      if (copy) copy.textContent = "Ask about breathing, rhythm, solfege, pronunciation, or difficult intervals.";
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", install);
  } else {
    install();
  }

  window.solfaiPolish = {
    resetChatState,
    resetAnalysisState,
    cancelActiveAnalysis,
    renderSignedInState,
    renderSignedOutState
  };
})();
</script>
